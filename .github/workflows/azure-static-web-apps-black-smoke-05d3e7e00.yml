name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  # PRs only build the frontend as a check; nothing is uploaded. Preview
  # environments kept failing at the Azure upload step, and changes are
  # verified on the live site after merge.
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          rm -rf node_modules
        env:
          VITE_API_URL: https://bugmind-backend-sea-h2epaudqf5gmcmhv.koreacentral-01.azurewebsites.net

      - name: Build And Deploy
        if: github.event_name == 'push'
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_SMOKE_05D3E7E00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "frontend/dist" # Point directly to the pre-built output
          api_location: "" # Api source code path - optional
          output_location: "" # Already at the built output
          skip_app_build: true
